name: Inference Doctor
description: Performance regression gate for LLM inference benchmarks that checks measurement quality first
author: dundysm

branding:
  icon: activity
  color: purple

inputs:
  baseline:
    description: Directory of repeated baseline results (normalized, vLLM, AIPerf, GuideLLM or SGLang)
    required: true
  candidate:
    description: Directory of repeated candidate results, in the same format
    required: true
  format:
    description: Result format (auto, normalized, vllm, aiperf, guidellm, sglang)
    required: false
    default: auto
  gpu:
    description: GPU name to record when the results do not include one
    required: false
    default: ""
  model:
    description: Model name to record when the results do not include one
    required: false
    default: ""
  guidellm-benchmark:
    description: Which benchmark of a GuideLLM sweep to compare, by index
    required: false
    default: ""
  metric:
    description: Metric to compare, or several separated by commas (FAIL if any fails)
    required: false
    default: output_token_throughput
  regression-percent:
    description: FAIL when the whole confidence interval for the regression is at or past this percentage
    required: false
    default: "10"
  confidence:
    description: Two-sided confidence level of the interval
    required: false
    default: "0.90"
  min-repetitions:
    description: Repetitions required on each side (5 or more recommended)
    required: false
    default: "3"
  stability-cv-percent:
    description: Optional ceiling on each side's coefficient of variation; empty means no ceiling
    required: false
    default: ""
  cost-gpu:
    description: (Experimental) Enables the cost gate. GPU type for list pricing (e.g. H100-SXM, A100-80G, L40S); see docs/cost.md
    required: false
    default: ""
  cost-gpus:
    description: Number of GPUs serving one benchmark run
    required: false
    default: "1"
  cost-price:
    description: (Experimental) $/GPU-hour you actually pay; enables the cost gate and overrides the list price
    required: false
    default: ""
  cost-max-increase-percent:
    description: Cost gate FAILs when the whole interval for the $/1M output-token increase is above this
    required: false
    default: "5"

outputs:
  result:
    description: PASS, FAIL, INCONCLUSIVE, or ERROR
    value: ${{ steps.report.outputs.result }}
  baseline-mean:
    description: Baseline mean for the selected metric (the first metric when several are given)
    value: ${{ steps.report.outputs.baseline_mean }}
  candidate-mean:
    description: Candidate mean for the selected metric (the first metric when several are given)
    value: ${{ steps.report.outputs.candidate_mean }}
  delta-percent:
    description: Candidate percentage delta versus baseline (the first metric when several are given)
    value: ${{ steps.report.outputs.delta_percent }}
  regression-percent-low:
    description: Lower bound of the confidence interval for the regression (positive is worse) (the first metric when several are given)
    value: ${{ steps.report.outputs.regression_percent_low }}
  regression-percent-high:
    description: Upper bound of the confidence interval for the regression (positive is worse) (the first metric when several are given)
    value: ${{ steps.report.outputs.regression_percent_high }}
  baseline-cv:
    description: Baseline coefficient of variation percentage (the first metric when several are given)
    value: ${{ steps.report.outputs.baseline_cv }}
  report:
    description: Path to the full JSON report
    value: ${{ steps.report.outputs.report }}
  cost-result:
    description: Cost gate PASS, FAIL, INCONCLUSIVE, ERROR, or empty when the cost gate is off
    value: ${{ steps.cost.outputs.result }}
  cost-change-percent:
    description: Change in mean $/1M output tokens, candidate versus baseline
    value: ${{ steps.cost.outputs.change_percent }}
  candidate-cv:
    description: Candidate coefficient of variation percentage (the first metric when several are given)
    value: ${{ steps.report.outputs.candidate_cv }}

runs:
  using: composite
  steps:
    # Installed into its own virtual environment so it cannot clash with the
    # caller's packages. Needs Python 3.11+ on the runner (setup-python, or the
    # runner image's python3).
    - name: Install Inference Doctor
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python_bin=$(command -v python3 || command -v python || true)
        if [ -z "$python_bin" ]; then
          echo "::error::Inference Doctor needs Python 3.11 or newer on the runner; add actions/setup-python."
          exit 3
        fi
        if ! "$python_bin" -c 'import sys; sys.exit(sys.version_info < (3, 11))'; then
          echo "::error::Inference Doctor needs Python 3.11 or newer; found $("$python_bin" --version 2>&1). Add actions/setup-python."
          exit 3
        fi
        venv="$RUNNER_TEMP/inference-doctor-venv"
        "$python_bin" -m venv "$venv"
        if [ -d "$venv/Scripts" ]; then bin="$venv/Scripts"; else bin="$venv/bin"; fi
        "$bin/python" -m pip install --quiet --disable-pip-version-check "$ACTION_PATH"
        echo "bin=$bin" >> "$GITHUB_OUTPUT"

    - name: Compare repeated benchmark runs
      id: compare
      shell: bash
      env:
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_METRIC: ${{ inputs.metric }}
        INPUT_REGRESSION_PERCENT: ${{ inputs['regression-percent'] }}
        INPUT_CONFIDENCE: ${{ inputs.confidence }}
        INPUT_MIN_REPETITIONS: ${{ inputs['min-repetitions'] }}
        INPUT_STABILITY_CV_PERCENT: ${{ inputs['stability-cv-percent'] }}
        INPUT_FORMAT: ${{ inputs.format }}
        INPUT_GPU: ${{ inputs.gpu }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_GUIDELLM_BENCHMARK: ${{ inputs['guidellm-benchmark'] }}
        TYPER_USE_RICH: "0"  # plain error text in the step summary
        ID_BIN: ${{ steps.install.outputs.bin }}
      run: |
        args=(
          compare-runs
          --baseline "$INPUT_BASELINE"
          --candidate "$INPUT_CANDIDATE"
          --regression-percent "$INPUT_REGRESSION_PERCENT"
          --confidence "$INPUT_CONFIDENCE"
          --min-repetitions "$INPUT_MIN_REPETITIONS"
          --format "$INPUT_FORMAT"
          --json
        )
        IFS=', ' read -r -a metrics <<< "$INPUT_METRIC"
        for metric in "${metrics[@]}"; do
          if [ -n "$metric" ]; then args+=(--metric "$metric"); fi
        done
        if [ -n "$INPUT_STABILITY_CV_PERCENT" ]; then
          args+=(--stability-cv-percent "$INPUT_STABILITY_CV_PERCENT")
        fi
        if [ -n "$INPUT_GPU" ]; then args+=(--gpu "$INPUT_GPU"); fi
        if [ -n "$INPUT_MODEL" ]; then args+=(--model "$INPUT_MODEL"); fi
        if [ -n "$INPUT_GUIDELLM_BENCHMARK" ]; then
          args+=(--guidellm-benchmark "$INPUT_GUIDELLM_BENCHMARK")
        fi
        set +e
        "$ID_BIN/inference-doctor" "${args[@]}" \
          > "$RUNNER_TEMP/inference-doctor-report.json" \
          2> "$RUNNER_TEMP/inference-doctor-error.txt"
        status=$?
        set -e
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"

    - name: Publish result
      id: report
      shell: bash
      env:
        ID_BIN: ${{ steps.install.outputs.bin }}
      run: |
        "$ID_BIN/python" - <<'PY'
        import json
        import os
        from pathlib import Path

        temp = Path(os.environ["RUNNER_TEMP"])
        report_path = temp / "inference-doctor-report.json"
        error_path = temp / "inference-doctor-error.txt"
        keys = (
            "baseline_mean",
            "candidate_mean",
            "delta_percent",
            "regression_percent_low",
            "regression_percent_high",
            "baseline_cv",
            "candidate_cv",
        )

        def set_output(key, value):
            with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                handle.write(f"{key}={'' if value is None else value}\n")

        if not report_path.exists() or not report_path.read_text(encoding="utf-8").strip():
            error = error_path.read_text(encoding="utf-8").strip() if error_path.exists() else "Inference Doctor did not produce a report."
            with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
                handle.write("## Inference Doctor\n\n**Result:** `ERROR`\n\n")
                handle.write(f"```text\n{error}\n```\n")
            set_output("result", "ERROR")
            set_output("report", None)
            for key in keys:
                set_output(key, None)
            raise SystemExit(0)

        report = json.loads(report_path.read_text(encoding="utf-8"))
        comparisons = report.get("comparisons", [report])
        first = comparisons[0]
        thresholds = report["thresholds"]

        def fmt(value, suffix=""):
            return "unavailable" if value is None else f"{value:.2f}{suffix}"

        def signed(value):
            return "unavailable" if value is None else f"{value:+.2f}%"

        def interval_text(comparison):
            interval = comparison["confidence_interval"]
            if not interval["available"]:
                return "unavailable"
            return f"{signed(interval['regression_percent_low'])} to {signed(interval['regression_percent_high'])}"

        lines = [
            "## Inference Doctor",
            "",
            f"**Result:** `{report['result']}`",
            "",
            f"| Metric | Runs | Baseline mean | Candidate mean | Delta | Regression, {thresholds['confidence']:.0%} interval | Result |",
            "| --- | ---: | ---: | ---: | ---: | ---: | --- |",
        ]
        for comparison in comparisons:
            lines.append(
                f"| `{comparison['metric']}` | {comparison['baseline']['count']} / {comparison['candidate']['count']} "
                f"| {fmt(comparison['baseline']['mean'])} | {fmt(comparison['candidate']['mean'])} "
                f"| {signed(comparison['delta_percent'])} | {interval_text(comparison)} | `{comparison['result']}` |"
            )
        lines += [
            "",
            f"Regression is positive when worse. Threshold: `{thresholds['regression_percent']:g}%`. "
            f"Minimum repetitions: `{thresholds['min_repetitions']}`.",
        ]

        if report["reasons"]:
            lines += ["", "**Why:**"] + [f"- {reason}" for reason in report["reasons"]]
        elif report["explanation"]:
            lines += ["", f"**Why:** {report['explanation']}."]
        for note in report.get("notes", []):
            lines += ["", f"**Note:** {note}."]

        if report["result"] == "INCONCLUSIVE":
            lines += ["", "No merge recommendation was made because the measurement was not trustworthy enough."]

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
            handle.write("\n".join(lines) + "\n")

        interval = first["confidence_interval"]
        set_output("result", report["result"])
        set_output("report", str(report_path))
        set_output("baseline_mean", first["baseline"]["mean"])
        set_output("candidate_mean", first["candidate"]["mean"])
        set_output("delta_percent", first["delta_percent"])
        set_output("regression_percent_low", interval.get("regression_percent_low"))
        set_output("regression_percent_high", interval.get("regression_percent_high"))
        set_output("baseline_cv", first["baseline"]["cv_percent"])
        set_output("candidate_cv", first["candidate"]["cv_percent"])
        PY

    - name: Cost gate (experimental)
      id: cost
      if: inputs['cost-gpu'] != '' || inputs['cost-price'] != ''
      shell: bash
      env:
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_CONFIDENCE: ${{ inputs.confidence }}
        INPUT_MIN_REPETITIONS: ${{ inputs['min-repetitions'] }}
        INPUT_COST_GPU: ${{ inputs['cost-gpu'] }}
        INPUT_COST_GPUS: ${{ inputs['cost-gpus'] }}
        INPUT_COST_PRICE: ${{ inputs['cost-price'] }}
        INPUT_COST_MAX: ${{ inputs['cost-max-increase-percent'] }}
        TYPER_USE_RICH: "0"
        ID_BIN: ${{ steps.install.outputs.bin }}
      run: |
        args=(cost-compare --baseline "$INPUT_BASELINE" --candidate "$INPUT_CANDIDATE"
          --gpus "$INPUT_COST_GPUS" --max-increase-pct "$INPUT_COST_MAX"
          --confidence "$INPUT_CONFIDENCE" --min-repetitions "$INPUT_MIN_REPETITIONS" --json)
        if [ -n "$INPUT_COST_GPU" ]; then args+=(--gpu "$INPUT_COST_GPU"); fi
        if [ -n "$INPUT_COST_PRICE" ]; then args+=(--price "$INPUT_COST_PRICE"); fi
        set +e
        "$ID_BIN/inference-doctor" "${args[@]}" \
          > "$RUNNER_TEMP/inference-doctor-cost.json" \
          2> "$RUNNER_TEMP/inference-doctor-cost-error.txt"
        status=$?
        set -e
        echo "exit_code=$status" >> "$GITHUB_OUTPUT"
        "$ID_BIN/python" - <<'PY'
        import json
        import os
        from pathlib import Path

        temp = Path(os.environ["RUNNER_TEMP"])
        out = temp / "inference-doctor-cost.json"
        text = out.read_text(encoding="utf-8").strip() if out.exists() else ""
        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary, open(
            os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8"
        ) as outputs:
            summary.write("\n## Inference Doctor: cost gate (experimental)\n\n")
            if not text:
                err = (temp / "inference-doctor-cost-error.txt").read_text(encoding="utf-8").strip()
                summary.write(f"**Result:** `ERROR`\n\n```text\n{err}\n```\n")
                outputs.write("result=ERROR\nchange_percent=\n")
                raise SystemExit(0)
            r = json.loads(text)
            summary.write(
                f"**Result:** `{r['result']}`\n\n"
                "| Runs | Baseline $/1M out | Candidate $/1M out | Change | "
                f"{r['confidence']:.0%} interval | Limit | $/hour |\n"
                "| ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n"
                f"| {r['runs'][0]} / {r['runs'][1]} | {r['baseline_mean']:.4f} | "
                f"{r['candidate_mean']:.4f} | {r['change_percent']:+.2f}% | "
                f"{r['change_percent_low']:+.2f}% to {r['change_percent_high']:+.2f}% | "
                f"+{r['max_increase_percent']:g}% | {r['hourly_usd']:.2f} |\n\n"
                "Cost = $/hour / measured output tokens per hour, at the same hardware on both sides.\n"
            )
            outputs.write(f"result={r['result']}\nchange_percent={r['change_percent']}\n")
        PY

    - name: Enforce gate
      shell: bash
      env:
        EXIT_CODE: ${{ steps.compare.outputs.exit_code }}
        COST_EXIT_CODE: ${{ steps.cost.outputs.exit_code }}
      run: |
        if [ "$EXIT_CODE" != "0" ]; then exit "$EXIT_CODE"; fi
        exit "${COST_EXIT_CODE:-0}"
