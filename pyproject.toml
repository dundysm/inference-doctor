[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inference-doctor"
version = "0.2.0"
description = "Diagnose vLLM inference bottlenecks from Prometheus telemetry."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
inference-doctor = "inference_doctor.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
