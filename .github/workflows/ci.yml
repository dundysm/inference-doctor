name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # a release workflow can run this before it builds

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    # Oldest and newest supported Python on Linux, and the newest on macOS and Windows
    # (the README documents PowerShell). No GPU: the suite uses synthetic results and the
    # checked-in examples.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    env:
      TYPER_USE_RICH: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -rs
      - name: The CLI runs and reports its version
        run: inference-doctor --version

  action:
    # Runs this repository's composite Action the way a caller would.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: The quickstart passes through the Action
        id: quickstart
        uses: ./
        with:
          baseline: examples/quickstart/baseline
          candidate: examples/quickstart/candidate
          metric: texts_per_second

      - name: The Action reports PASS
        env:
          RESULT: ${{ steps.quickstart.outputs.result }}
        run: test "$RESULT" = "PASS"

      - name: The regressed quickstart candidate fails through the Action
        id: regressed
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/quickstart/baseline
          candidate: examples/quickstart/regressed-candidate
          metric: texts_per_second

      - name: The Action reports FAIL and fails the step
        env:
          RESULT: ${{ steps.regressed.outputs.result }}
          OUTCOME: ${{ steps.regressed.outcome }}
        run: test "$RESULT" = "FAIL" && test "$OUTCOME" = "failure"

      - name: vLLM bench serve results are read directly
        id: vllm
        uses: ./
        with:
          baseline: examples/vllm-bench-serve/baseline
          candidate: examples/vllm-bench-serve/candidate

      - name: The Action reports PASS for vLLM throughput
        env:
          RESULT: ${{ steps.vllm.outputs.result }}
        run: test "$RESULT" = "PASS"

      - name: Gating throughput and TTFT p99 together fails on TTFT
        id: multi
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/vllm-bench-serve/baseline
          candidate: examples/vllm-bench-serve/candidate
          metric: output_token_throughput, ttft_p99_ms

      - name: The Action reports FAIL for the combined gate
        env:
          RESULT: ${{ steps.multi.outputs.result }}
          OUTCOME: ${{ steps.multi.outcome }}
        run: test "$RESULT" = "FAIL" && test "$OUTCOME" = "failure"

      - name: A missing directory is reported as ERROR
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/quickstart/does-not-exist
          candidate: examples/quickstart/candidate
          metric: texts_per_second

      - name: The Action reports ERROR
        env:
          RESULT: ${{ steps.invalid.outputs.result }}
        run: test "$RESULT" = "ERROR"

  action-isolated:
    # The Action installs itself into its own virtual environment, so it works with the
    # runner image's python3 and leaves the caller's packages alone.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nothing from Inference Doctor is installed in the caller's Python
        run: "! python3 -c 'import inference_doctor'"
      - name: The quickstart passes without setup-python
        id: quickstart
        uses: ./
        with:
          baseline: examples/quickstart/baseline
          candidate: examples/quickstart/candidate
          metric: texts_per_second
      - name: The Action reported PASS and left the caller's Python untouched
        env:
          RESULT: ${{ steps.quickstart.outputs.result }}
        run: |
          test "$RESULT" = "PASS"
          ! python3 -c 'import inference_doctor'
