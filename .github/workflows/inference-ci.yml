name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          NO_COLOR: "1"
        run: python -m pytest -q

  inference-doctor-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Run the no-GPU quickstart through the Action
        uses: ./
        with:
          baseline: examples/quickstart/baseline
          candidate: examples/quickstart/candidate
          metric: texts_per_second
