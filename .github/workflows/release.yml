name: release

# Publishes to PyPI when a v* tag is pushed, with PyPI trusted publishing: no token is
# stored in this repository. PyPI has a publisher registered for project
# inference-doctor, owner dundysm, repository inference-doctor, workflow release.yml,
# environment pypi, and the pypi environment here only accepts v* tags.
#
# Gates before anything is uploaded:
#   1. the tagged commit is on main,
#   2. the full CI workflow passes on it,
#   3. the tag equals the package version (v0.4.0 for __version__ = "0.4.0"),
#   4. the sdist and wheel pass twine check --strict, the sdist's tests pass, and the
#      wheel installs and runs.

on:
  push:
    # Full versions only; the Action's moving major tag (v1) must not start a release.
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME is not on main"; exit 1; }
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Tag matches the package version
        run: |
          v=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('src/inference_doctor/__init__.py').read())[1])")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package $v"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: The sdist's own test suite passes
        run: |
          mkdir /tmp/sdist && tar xzf dist/*.tar.gz -C /tmp/sdist
          cd /tmp/sdist/inference_doctor-*
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install --quiet ".[dev]"
          /tmp/sdist-venv/bin/python -m pytest -q
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          /tmp/wheel-check/bin/inference-doctor --version
          /tmp/wheel-check/bin/inference-doctor compare-runs \
            --baseline examples/quickstart/baseline \
            --candidate examples/quickstart/candidate \
            --metric texts_per_second
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
