<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="t d">
  <title id="t">How compare-runs decides</title>
  <desc id="d">Three 90% confidence intervals for the regression, positive is worse, against the default 10% threshold, from the checked-in examples. Quickstart: +1.08% to +2.92%, entirely below the threshold, PASS. Real H100 run: -3.33% to +11.17%, contains the threshold, INCONCLUSIVE. Regressed quickstart candidate: +13.13% to +14.87%, entirely past the threshold, FAIL.</desc>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --edge:#d1d9e0; --band:#f6f8fa; --ok:#1a7f37; --warn:#9a6700; --bad:#cf222e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --edge:#3d444d; --band:#151b23; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .bg { fill: var(--bg); }
    .band { fill: var(--band); }
    .name { font-size: 14px; font-weight: 600; fill: var(--fg); }
    .src { font-size: 12px; fill: var(--muted); }
    .tick { font-size: 12px; fill: var(--muted); }
    .label { font-size: 11px; fill: var(--muted); letter-spacing: 0.8px; }
    .axis { stroke: var(--edge); stroke-width: 1.5; }
    .grid { stroke: var(--edge); stroke-width: 1; }
    .thr { stroke: var(--fg); stroke-width: 2; stroke-dasharray: 6 5; }
    .ci { stroke-width: 6; stroke-linecap: round; animation: grow 9s infinite; }
    .pt { stroke: var(--bg); stroke-width: 2.5; animation: fade 9s infinite; }
    .verdict { font-size: 14px; font-weight: 700; animation: fade 9s infinite; }
    .ok { stroke: var(--ok); fill: var(--ok); } .warn { stroke: var(--warn); fill: var(--warn); } .bad { stroke: var(--bad); fill: var(--bad); }
    .verdict.ok, .verdict.warn, .verdict.bad { stroke: none; }
    .ci, .pt, .verdict { animation-fill-mode: both; }
    @keyframes grow { 0% { transform: scaleX(0.02); opacity: 0; } 10% { opacity: 1; } 22% { transform: scaleX(1); } 92% { transform: scaleX(1); opacity: 1; } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes fade { 0%, 20% { opacity: 0; } 26%, 92% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .ci, .pt, .verdict { animation: none; } }
  </style>
  <rect class="bg" width="900" height="300" rx="12"/>
  <!-- x(v) = 312 + 22.4 * v, v in percent; plot spans -5% (200) to +20% (760) -->
  <rect class="band" x="536" y="40" width="224" height="196"/>
  <text class="label" x="544" y="56">PAST THE THRESHOLD</text>
  <line class="grid" x1="312" y1="40" x2="312" y2="236"/>
  <line class="axis" x1="200" y1="236" x2="760" y2="236"/>
  <g class="tick" text-anchor="middle">
    <text x="200" y="256">-5%</text><text x="312" y="256">0%</text><text x="424" y="256">+5%</text>
    <text x="536" y="256">+10%</text><text x="648" y="256">+15%</text><text x="760" y="256">+20%</text>
  </g>
  <text class="label" x="480" y="284" text-anchor="middle">REGRESSION, POSITIVE IS WORSE (90% CONFIDENCE INTERVAL)</text>
  <line class="thr" x1="536" y1="32" x2="536" y2="244"/>
  <text class="label" x="536" y="26" text-anchor="middle">THRESHOLD 10%</text>

  <!-- PASS: quickstart -->
  <text class="name" x="24" y="88">Quickstart</text>
  <text class="src" x="24" y="105">5 + 5 runs, -2.0%</text>
  <line class="ci ok" x1="336.2" y1="92" x2="377.4" y2="92" style="transform-origin:356.8px 92px"/>
  <circle class="pt ok" cx="356.8" cy="92" r="6"/>
  <text class="verdict ok" x="776" y="97">PASS</text>

  <!-- INCONCLUSIVE: real H100 run -->
  <text class="name" x="24" y="148">Real H100 run</text>
  <text class="src" x="24" y="165">6 + 6 runs, -4.19%</text>
  <line class="ci warn" x1="237.4" y1="152" x2="562.2" y2="152" style="transform-origin:405.9px 152px; animation-delay:0.4s"/>
  <circle class="pt warn" cx="405.9" cy="152" r="6" style="animation-delay:0.4s"/>
  <text class="verdict warn" x="776" y="157" style="animation-delay:0.4s">INCONCLUSIVE</text>

  <!-- FAIL: regressed quickstart candidate -->
  <text class="name" x="24" y="208">Regressed candidate</text>
  <text class="src" x="24" y="225">5 + 5 runs, -14.0%</text>
  <line class="ci bad" x1="606.1" y1="212" x2="645.1" y2="212" style="transform-origin:625.6px 212px; animation-delay:0.8s"/>
  <circle class="pt bad" cx="625.6" cy="212" r="6" style="animation-delay:0.8s"/>
  <text class="verdict bad" x="776" y="217" style="animation-delay:0.8s">FAIL</text>
</svg>
